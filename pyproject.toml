[project]
name = "reg-rag"
version = "0.1.0"
description = "Bilingual FR/EN RAG assistant over EU banking regulation, fully local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pyarrow>=26.0.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

# Python package lives in src/rag (import as `rag`)
[tool.uv.build-backend]
module-name = "rag"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = ["data: needs the downloaded corpus + data/processed/chunks.parquet (skipped otherwise)"]
