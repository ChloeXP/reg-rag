repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files   # blocks accidental PDF / model commits (>500 KB)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1                      # same version as dev dependency in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
