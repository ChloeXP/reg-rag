# Hand-curated list of source documents (the "wish list").
# The download script reads this file and generates data/manifest.csv (what we actually got).
# doc_id = one file / one language; work_id = same legal text across languages.
# method: http (default) | cellar (EU Publications Office API, by CELEX id) | manual (browser)
# format: pdf (default) | xhtml

