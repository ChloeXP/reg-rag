# S06 · ai_act · en · article · copy 0.5 · flags: facts 3/4 in source
# ---- SOURCE ai_act_en::structure::0208 (read-only) ----
#   [AI ACT · Article 3 Definitions]
#   For the purposes of this Regulation, the following definitions apply:
#   (1) ‘AI system’ means a machine-based system that is designed to operate with varying
#   levels of autonomy and that may exhibit adaptiveness after deployment, and that, for
#   explicit or implicit objectives, infers, from the input it receives, how to generate
#   outputs such as predictions, content, recommendations, or decisions that can influence
#   physical or virtual environments;
#   (2) ‘risk’ means the combination of the probability of an occurrence of harm and the
#   severity of that harm;
#   (3) ‘provider’ means a natural or legal person, public authority, agency or other body
#   that develops an AI system or a general-purpose AI model or that has an AI system or a
#   general-purpose AI model developed and places it on the market or puts the AI system into
#   service under its own name or trademark, whether for payment or free of charge;
#   (4) ‘deployer’ means a natural or legal person, public authority, agency or other body
#   using an AI system under its authority except where the AI system is used in the course of
#   a personal non-professional activity;
#   (5) ‘authorised representative’ means a natural or legal person located or established in
#   the Union who has received and accepted a written mandate from a provider of an AI system
#   or a general-purpose AI model to, respectively, perform and carry out on its behalf the
#   obligations and procedures established by this Regulation;
#   (6) ‘importer’ means a natural or legal person located or established in the Union that
#   places on the market an AI system that bears the name or trademark of a natural or legal
#   person established in a third country;
#   (7) ‘distributor’ means a natural or legal person in the supply chain, other than the
#   provider or the importer, that makes an AI system available on the Union market;
#   (8) ‘operator’ means a provider, product manufacturer, deployer, authorised
#   representative, importer or distributor;
#   (9) ‘placing on the market’ means the first making available of an AI system or a general-
#   purpose AI model on the Union market;
- seed_id: S06
  decision: accept
  drop_reason: null
  question_language: auto
  question_en: "How does the AI Act define an 'AI system'?"
  question_fr: "Comment l'AI Act définit-il un « système d'IA » ?"
  ground_truth: |-
    An AI system is a machine-based system designed to operate with varying levels of
    autonomy, that may exhibit adaptiveness after deployment, and that, for explicit or
    implicit objectives, infers from the input it receives how to generate outputs such as
    predictions, content, recommendations or decisions that can influence physical or
    virtual environments.
  key_facts:
    - fact: "machine-based system"
      pattern: '(machine-based\s+system|système\s+automatisé)'
    - fact: "varying levels of autonomy"
      pattern: '(levels\s+of\s+autonomy|niveaux\s+d.autonomie)'
    - fact: "infers how to generate outputs"
      pattern: '(infers|dédui[ts])'
  source_chunk_ids: [ai_act_en::structure::0208]
