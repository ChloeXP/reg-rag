#   iii) Third party service providers, vendors and vendors’ products may become channels to
#   propagate cyber-attacks; therefore, an interconnected financial institution that has
#   individual low relevance may become vulnerable and a source of risk propagation. Observing
#   the weakest link principle, cybersecurity should not only be a concern for major market
#   participants and critical service providers.
