# ---- SOURCE ai_act_en::structure::0029 (read-only) ----
#   [AI ACT · Recital 24]
#   In those cases, the fact that an AI system may fall within the scope of this Regulation
#   should not affect the possibility of entities carrying out national security, defence and
#   military activities, regardless of the type of entity carrying out those activities, to
#   use AI systems for national security, military and defence purposes, the use of which is
#   excluded from the scope of this Regulation. An AI system placed on the market for civilian
#   or law enforcement purposes which is used with or without modification for military,
#   defence or national security purposes should not fall within the scope of this Regulation,
#   regardless of the type of entity carrying out those activities.
- seed_id: S01
  decision: accept
  drop_reason: null
  question_language: auto
  question_en: "How does the AI Act treat a civilian AI product that is later reused for military or national security purposes?"
  question_fr: "Comment l'AI Act traite-t-il un produit d'IA civil réutilisé ensuite à des fins militaires ou de sécurité nationale ?"
  ground_truth: |-
    An AI system placed on the market for civilian or law enforcement purposes that is used,
    with or without modification, for military, defence or national security purposes does
    not fall within the scope of the AI Act, whatever the type of entity carrying out those
    activities. The use of AI systems for national security, military and defence purposes
    is excluded from the scope of the Regulation.
