#   a. The staff working in the model development unit, Credit Risk Control Unit (CRCU) and
#   the validation unit is sufficiently skilled to develop and validate ML models and,
#   therefore, to assess the relevance and appropriateness of the risk drivers used, as well
#   as the soundness of the underlying economic rationale in the overall model. For these
#   purposes, appropriate actions are taken, such as, for example, on the organisation of
#   technical in-depth training sessions. b. The management body and senior management are in
#   the position to have a good understanding of the model, by providing them with appropriate
#   high-level documentation. That documentation should at least clarify which indicators or
#   variables are the key drivers for the assignment of exposures to grade or pools, as well
#   as – if relevant – how ML models impact the risk quantification.
#   It is recommended that institutions find an appropriate balance between model performance
#   and explainability of the results. Indeed, a higher level of complexity may lead to better
#   model performances, but at the cost of lower explainability and comprehension of the
#   model’s functioning. Therefore, institutions are recommended to avoid unnecessary
#   complexity in the modelling approach if it is not justified by a significant improvement
#   in the predictive capacities. Institutions are recommended to avoid:
#   a. including an excessive number of explanatory drivers or drivers with no significant
#   predictive information; b. using unstructured data if more conventional data is available
#   that provides similar predictive capacities; and c. overly complex modelling choices if
#   simpler approaches yielding similar results are available.
#   In addition, to ensuring that the model is correctly interpreted and understood,
#   institutions are recommended to:
