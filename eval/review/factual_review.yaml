#   l’application des règles métier est suivie de la prédiction par le ML. Ainsi, plutôt qu’un
#   outil de classification d’alertes déjà déclenchées, le groupe bancaire a mis en œuvre un
#   outil de détection d’alertes validées qui s'applique à l'ensemble du flux de transactions.
