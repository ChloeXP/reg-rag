#   techniques has also continuously increased in the banking sector over the years, with the
#   main areas of application being fraud detection, AML/CFT, client and transaction
#   profiling/clustering and real-time monitoring of payments.2 In the area of credit risk, EU
#   financial institutions using ML techniques mainly use them in their credit worthiness
#   assessment or credit scoring for credit granting.
#   2. ML techniques are however less used in the area of credit risk as regards determination
#   of capital requirements. This can be partly ascribed to existing doubts about whether the
#   ML techniques can comply with the regulatory requirements on the use of IRB models. This
#   is in particular relevant, as the majority of financial institutions today use variants of
#   regression analysis when using internal models to determine credit risk capital
#   requirements, whereas the use of decision trees/ random forest or other ML techniques is
#   limited to fewer financial institutions.
#   3. On 11 November 2021, the EBA published and consulted on the DP on ‘Machine learning for
#   IRB models’ with the aim to engage the industry and supervisory community to investigate
#   the possible use of ML for IRB models and to build up a common understanding of the
#   general aspects of ML for IRB models and the related challenges in complying with the
#   regulatory requirements. The DP gave an overview of the challenges and opportunities
#   stemming from the use of more advanced ML techniques, when applied in the context of IRB
#   models to calculate regulatory capital for credit risk. It furthermore identified which
#   characteristics of ML might make it more challenging or easier to comply with the
#   regulatory requirements for IRB models.
