#   élevé par le modèle de ML, une alerte ne soit générée que si aucune alerte n’a été levée
#   par le moteur de règles métier sur ce même client dans les trois mois précédents.
#   Autrement dit, une alerte déclenchée par l’outil de ML est une alerte ayant obtenu un
#   score élevé et qui est passée sous les seuils de détection du moteur de règles métier dans
#   les trois mois précédents. -Enfin, contrairement au moteur de règles métier, le modèle de
#   ML considère des éléments complémentaires aux données de transaction : il combine les
#   valeurs statistiques des transactions conjointement avec des variables dites statiques
#   (soit des mesures directes telles qu’ancienneté du client ou valeur du patrimoine, soit
#   des variables construites telles que type de produits et contrats) sur une fenêtre
