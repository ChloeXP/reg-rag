#   obligations, as laid down in the credit agreement, and is in line with the conditions set
#   at the point of credit granting, such as adherence to credit metrics and covenants. 252.
#   Institutions should also monitor whether the borrower and collateral are in line with the
#   credit risk policies and conditions set at the point of credit granting, e.g. whether the
#   value of collateral and other credit enhancement techniques are maintained, whether any
#   applicable covenants are maintained, and whether there has been a negative development in
#   these factors or in other factors that affect the risk profile of the borrower and/or
#   credit facilities. 253. Institutions should continuously monitor and assess the quality of
#   credit exposures and the financial situation of borrowers, to ensure that subsequent
#   changes in credit risk, in respect of the initial recognition of the lending exposures,
#   can be identified and quantified. 254. The ongoing monitoring should be based on internal
#   information regarding the credit facilities and borrowers’ payment practices, as well as
#   the use of external sources (e.g. credit bureaux, directly from the borrower), when
#   relevant. 255. In addition, institutions should also monitor concentration measures
#   against the values specified in their credit risk appetite, policies and procedures,
#   including, where relevant, by product, geography, industry, collateral features (type,
#   location), and quality of portfolios, sub-portfolios and exposures. 256. Institutions
#   engaged in syndicating leveraged transactions should implement internal standards and
#   monitoring functions for these activities. Institutions should identify transactions
#   subject to failed syndications — that is, transaction that were not syndicated within 90
#   days following the commitment date. Institutions should establish a dedicated framework to
#   deal with these ‘hung transactions’ in terms of holding strategy, booking and accounting
#   practices, regulatory classification and subsequent capital requirements calculation.
