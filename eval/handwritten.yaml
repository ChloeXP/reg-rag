# Step 5.5 - handwritten golden-set items: multi_hop, article_lookup, no_answer, adversarial.
# Drafted by Claude from the corpus (decision 5.5-B), verified by Chloe: HIGH-RISK items line
# by line (side-by-side aid), the rest spot-checked. Validate: uv run python -m rag.handwritten --check
# expected[0] = the PRIMARY work (counted against spec.works).
# key_facts / must_match patterns are bilingual: the system answers in the QUESTION language.
# no_answer: absence_patterns must have ZERO hits in the corpus (checked by code) = proof of absence.

- hid: H01
  type: multi_hop
  question_language: en
  question: "Under the CRR, from what size does an exposure to a client count as a 'large exposure', and what is the maximum it may reach?"
  expected_behavior: answer
  expected: [{"work_id": "crr", "articles": ["392"]}, {"work_id": "crr", "articles": ["395"]}]
  source_chunk_ids: [crr_en::structure::0749, crr_en::structure::0753]
  ground_truth: |-
    An exposure to a client or group of connected clients is a large exposure when its value
    is equal to or exceeds 10 % of the institution's eligible capital (Article 392). After
    credit risk mitigation, an institution shall not incur an exposure to a client or group
    of connected clients exceeding 25 % of its eligible capital (Article 395(1)).
  key_facts:
    - fact: "10 % of eligible capital"
      pattern: '10\W{0,3}%'
    - fact: "25 % limit"
      pattern: '25\W{0,3}%'
  notes: "Two articles: definition (392) + limit (395). Q4/P39: the 25 % sits in the first chunk of Article 395. drafted by Claude (5.5-B) - HIGH-RISK re-checked by Claude against SOURCE (2026-10-18); not human-verified"

- hid: H02
  type: multi_hop
  question_language: fr
  question: "Selon l'AI Act, comment est classé un système d'IA qui évalue la solvabilité des particuliers, et à partir de quelle date le règlement s'applique-t-il en général ?"
  expected_behavior: answer
  expected: [{"work_id": "ai_act", "sections": ["ANNEX III ", "ANNEXE III "]}, {"work_id": "ai_act", "articles": ["113"]}]
  source_chunk_ids: [ai_act_fr::structure::0443, ai_act_fr::structure::0434]
  ground_truth: |-
    Les systèmes d'IA destinés à être utilisés pour évaluer la solvabilité des personnes
    physiques ou pour établir leur note de crédit figurent à l'annexe III (point 5 b)) parmi
    les systèmes d'IA à haut risque, à l'exception des systèmes d'IA utilisés à des fins de
    détection de fraudes financières. Le règlement est applicable à partir du 2 août 2026
    (les chapitres I et II dès le 2 février 2025).
  key_facts:
    - fact: "haut risque (annexe III)"
      pattern: '(haut\s+risque|high[-\s]risk)'
    - fact: "exception : détection de la fraude financière"
      pattern: '(fraudes?\s+financières?|financial\s+fraud)'
    - fact: "2 août 2026"
      pattern: '2\s+(août|august)\s+2026'
  notes: "drafted by Claude (5.5-B) - HIGH-RISK re-checked by Claude against SOURCE (2026-10-18); not human-verified"

- hid: H03
  type: multi_hop
  question_language: en
  question: "What is the maximum fine under the AI Act for a company that puts a social scoring system on the market?"
  expected_behavior: answer
  expected: [{"work_id": "ai_act", "articles": ["5"]}, {"work_id": "ai_act", "articles": ["99"]}]
  source_chunk_ids: [ai_act_en::structure::0217, ai_act_en::structure::0367]
  ground_truth: |-
    AI systems that evaluate or classify natural persons over time based on their social
    behaviour or personal characteristics, with the social score leading to detrimental or
    unfavourable treatment, are prohibited AI practices under Article 5(1)(c). Non-
    compliance with the Article 5 prohibitions is subject to administrative fines of up to
    EUR 35 000 000 or, for an undertaking, up to 7 % of its total worldwide annual turnover
    for the preceding financial year, whichever is higher (Article 99(3)).
  key_facts:
    - fact: "EUR 35 000 000"
      pattern: '35[\s,.]?000[\s,.]?000|35\s+mill'
    - fact: "7 % of worldwide annual turnover"
      pattern: '7\W{0,3}%'
    - fact: "whichever is higher"
      pattern: '(whichever\s+is\s+higher|le\s+montant\s+le\s+plus\s+élevé)'
  notes: "Article 5 (what is prohibited) + Article 99 (the fine). drafted by Claude (5.5-B) - HIGH-RISK re-checked by Claude against SOURCE (2026-10-18); not human-verified"

- hid: H04
  type: multi_hop
  question_language: fr
  question: "DORA et les orientations de l'ABE sur l'externalisation imposent toutes deux de tenir un registre : quels accords chaque registre doit-il couvrir, et à quels niveaux ?"
  expected_behavior: answer
  expected: [{"work_id": "eba_gl_2019_02", "sections": ["4. Guidelines on outsourcing > Title III – Governance framework > 11 Documentation requirements"]}, {"work_id": "dora", "articles": ["28"]}]
  source_chunk_ids: [eba_gl_outsourcing_en::structure::0046, dora_fr::structure::0178]
  ground_truth: |-
    DORA (article 28, paragraphe 3) impose aux entités financières de tenir et mettre à
    jour, au niveau de l'entité et aux niveaux sous-consolidé et consolidé, un registre
    d'informations sur tous les accords contractuels portant sur l'utilisation de services
    TIC fournis par des prestataires tiers de services TIC. Les orientations de l'ABE
    (paragraphe 52) demandent un registre à jour de tous les accords d'externalisation, au
    niveau de l'établissement et, le cas échéant, aux niveaux sous-consolidé et consolidé,
    en distinguant l'externalisation de fonctions critiques ou importantes des autres
    accords et en conservant les accords terminés pendant une période appropriée.
  key_facts:
    - fact: "services TIC (DORA) / externalisation (ABE)"
      pattern: '(services\s+TIC|ICT\s+services)'
    - fact: "niveaux sous-consolidé et consolidé"
      pattern: '(sous-consolidé|sub-consolidated)'
    - fact: "accords d'externalisation"
      pattern: '(outsourcing\s+arrangements|accords\s+d.externalisation)'
  notes: "Cross-work DORA (FR) + EBA GL 2019/02 (EN). Same section as smoke Q2, different paragraph (52 vs 54). drafted by Claude (5.5-B) - not human-verified"

- hid: H05
  type: multi_hop
  question_language: en
  question: "How often do DORA and the EBA ICT and security risk guidelines require the ICT risk management framework to be reviewed?"
  expected_behavior: answer
  expected: [{"work_id": "eba_gl_2019_04", "sections": ["Guidelines on ICT and security risk management > 3.3. ICT and security risk management framework > 3.3.1. Organisation and objectives"]}, {"work_id": "dora", "articles": ["6"]}]
  source_chunk_ids: [eba_gl_ict_security_en::structure::0025, dora_fr::structure::0130]
  ground_truth: |-
    Under DORA (Article 6(5)) the ICT risk management framework is documented and reviewed
    at least once a year (periodically for microenterprises), as well as upon the occurrence
    of major ICT-related incidents and following supervisory instructions or conclusions
    from testing or audits. The EBA guidelines (paragraph 14) require the framework to be
    documented, continuously improved and approved and reviewed at least once a year by the
    management body.
  key_facts:
    - fact: "at least once a year"
      pattern: '(at\s+least\s+once\s+a\s+year|au\s+moins\s+une\s+fois\s+par\s+an)'
    - fact: "major ICT-related incidents"
      pattern: '(incidents\s+majeurs|major\s+ICT)'
    - fact: "by the management body"
      pattern: '(management\s+body|organe\s+de\s+direction)'
  notes: "Cross-lingual for the DORA part (EN question, FR source). drafted by Claude (5.5-B) - not human-verified"

- hid: H06
  type: multi_hop
  question_language: fr
  question: "L'AI Act classe le scoring de crédit des particuliers comme à haut risque : selon l'ABE, cela s'applique-t-il aussi aux modèles NI utilisés pour calculer les exigences de fonds propres ?"
  expected_behavior: answer
  expected: [{"work_id": "ai_act", "sections": ["ANNEX III ", "ANNEXE III "]}, {"work_id": "eba_ml_irb_2023", "sections": ["5. Interaction with (non-CRR) regulatory frameworks > 5.2 Interaction with AI Act > 5.2.1 Clarification on the scope of application of the AI Act"]}]
  source_chunk_ids: [ai_act_en::structure::0395, eba_ml_irb_report_en::structure::0024]
  ground_truth: |-
    AI systems intended to evaluate the creditworthiness of natural persons or establish
    their credit score are listed as high-risk in Annex III (point 5(b)), except those used
    to detect financial fraud. In its 2023 report, the EBA's view is that the high-risk
    scope should cover only systems used for creditworthiness assessment and credit scoring
    of natural persons at loan origination, and therefore does not apply directly to other
    parts of the credit process such as IRB models used to calculate capital requirements;
    however, the AI Act may still affect IRB models indirectly through the prudential use-
    test requirement.
  key_facts:
    - fact: "not directly to IRB models"
      pattern: '(IRB|modèles?\s+NI|notations?\s+internes?)'
    - fact: "at loan origination"
      pattern: '(loan\s+origination|octroi)'
    - fact: "indirectly via the use-test"
      pattern: '(use[-\s]test|indirect)'
  notes: "Cross-work AI Act + EBA ML report; the question is FR, both sources are EN (EBA part is cross-lingual). Yes/no framing is followed by the reason: the answer must give the EBA view + the indirect effect. drafted by Claude (5.5-B) - not human-verified"

- hid: H07
  type: multi_hop
  question_language: en
  question: "Which business areas did the ACPR's 2020 exploratory work on AI cover, and what levels of explanation does the paper propose?"
  expected_behavior: answer
  expected: [{"work_id": "acpr_ia_2020", "sections": ["Juin 2020 Gouvernance des algorithmes d’intelligence artificielle dans le secteur financier Document de réflexion AUTEURS Laurent Dupont, Olivier Fliche, Su Yang Pôle Fintech-Innovation, ACPR > 1. Résumé"]}, {"work_id": "acpr_ia_2020", "sections": ["Juin 2020 Gouvernance des algorithmes d’intelligence artificielle dans le secteur financier Document de réflexion AUTEURS Laurent Dupont, Olivier Fliche, Su Yang Pôle Fintech-Innovation, ACPR > PRINCIPE D’EXPLICABILITÉ > 3.4.7. Exemples de niveaux d’explication par cas d’usage > Cas d'usage Critères d'explicabilité Niveau d'explication requis Fonctionnalité de Audience de Domaine Processus métier l'IA l'explication Contexte Risque associé"]}]
  source_chunk_ids: [acpr_ia_gouvernance_fr::structure::0000, acpr_ia_gouvernance_fr::structure::0041]
  ground_truth: |-
    Les travaux exploratoires couvraient trois domaines : la lutte contre le blanchiment et
    le financement du terrorisme (LCB-FT), les modèles internes et en particulier le scoring
    de crédit, et la protection de la clientèle. Le document propose quatre niveaux
    d'explication, par exigence croissante : 1. observation, 2. justification, 3.
    approximation, 4. réplication ; le niveau exigible dépend notamment de l'audience visée
    et du risque associé.
  key_facts:
    - fact: "LCB-FT / AML"
      pattern: '(LCB-FT|blanchiment|money\s+laundering|AML)'
    - fact: "observation"
      pattern: 'observation'
    - fact: "réplication"
      pattern: '(réplication|replication)'
  notes: "Cross-lingual (EN question, FR source). The four levels also appear in the summary (chunk 0001). drafted by Claude (5.5-B) - not human-verified"

- hid: H08
  type: multi_hop
  question_language: en
  question: "What do DORA and the EBA outsourcing guidelines each require so that a bank can leave a critical ICT or outsourcing provider without disruption?"
  expected_behavior: answer
  expected: [{"work_id": "dora", "articles": ["28"]}, {"work_id": "eba_gl_2019_02", "sections": ["4. Guidelines on outsourcing > Title III – Governance framework > 15 Exit strategies"]}]
  source_chunk_ids: [dora_fr::structure::0181, eba_gl_outsourcing_en::structure::0067]
  ground_truth: |-
    DORA (Article 28(8)) requires exit strategies for ICT services supporting critical or
    important functions, so that financial entities can exit contracts without disrupting
    their activities, limiting compliance with regulatory requirements, or harming the
    continuity and quality of services to clients; exit plans must be comprehensive,
    documented, sufficiently tested and periodically reviewed, with alternative solutions
    and transition plans. The EBA guidelines (paragraphs 106-107) require a documented exit
    strategy for critical or important functions covering termination, provider failure,
    deterioration of quality and material risks, and the ability to exit without undue
    disruption, through comprehensive, documented and sufficiently tested exit plans and
    transition plans to alternative providers or back in-house.
  key_facts:
    - fact: "exit strategy / plan"
      pattern: '(exit\s+(strateg|plan)|stratégies?\s+de\s+sortie|plans?\s+de\s+sortie)'
    - fact: "tested"
      pattern: '(tested|testés?|tests?\s+suffisants)'
    - fact: "transition plans"
      pattern: '(transition\s+plans?|plans?\s+de\s+transition)'
  notes: "Cross-work; the DORA part is cross-lingual. S28 (EBA exit strategies) was dropped in 5.4, so no overlap with the factual set. drafted by Claude (5.5-B) - not human-verified"

- hid: H09
  type: multi_hop
  question_language: fr
  question: "Selon DORA, à quelle fréquence les entités financières doivent-elles tester leurs systèmes TIC critiques, et à quelle fréquence pour les tests de pénétration fondés sur la menace ?"
  expected_behavior: answer
  expected: [{"work_id": "dora", "articles": ["24"]}, {"work_id": "dora", "articles": ["26"]}]
  source_chunk_ids: [dora_fr::structure::0168, dora_fr::structure::0170]
  ground_truth: |-
    Les entités financières, autres que les microentreprises, soumettent au moins une fois
    par an tous les systèmes et applications de TIC qui soutiennent des fonctions critiques
    ou importantes à des tests appropriés (article 24, paragraphe 6). Les entités
    identifiées par l'autorité compétente effectuent au moins tous les trois ans des tests
    avancés au moyen d'un test de pénétration fondé sur la menace ; l'autorité compétente
    peut demander de réduire ou d'augmenter cette fréquence selon le profil de risque
    (article 26, paragraphe 1).
  key_facts:
    - fact: "au moins une fois par an"
      pattern: '(au\s+moins\s+une\s+fois\s+par\s+an|at\s+least\s+(once\s+a\s+year|annually|yearly))'
    - fact: "au moins tous les trois ans"
      pattern: '(trois\s+ans|three\s+years|3\s+(ans|years))'
  notes: "S18 (Article 27(2), internal testers) is a different provision. drafted by Claude (5.5-B) - not human-verified"

- hid: H10
  type: multi_hop
  question_language: fr
  question: "Quelles exigences de liquidité à court et à long terme le CRR prévoit-il pour les établissements ?"
  expected_behavior: answer
  expected: [{"work_id": "crr", "articles": ["412"]}, {"work_id": "crr", "articles": ["413"]}]
  source_chunk_ids: [crr_en::structure::0781, crr_en::structure::0782]
  ground_truth: |-
    Under Article 412 (liquidity coverage requirement), institutions shall hold liquid
    assets whose value covers liquidity outflows less inflows under stressed conditions, so
    that their liquidity buffers are adequate to face any imbalance under gravely stressed
    conditions over a period of thirty days. Under Article 413 (stable funding),
    institutions shall ensure that long-term obligations are adequately met with a diversity
    of stable funding instruments under both normal and stressed conditions. In this version
    of the CRR, the detailed provisions of Titles II and III apply exclusively for the
    purpose of specifying reporting obligations (Article 415).
  key_facts:
    - fact: "thirty days"
      pattern: '(thirty\s+days|30\s+(days|jours)|trente\s+jours)'
    - fact: "stable funding instruments"
      pattern: '(stable\s+funding|financement\s+stable)'
    - fact: "reporting only (this CRR version)"
      pattern: '(reporting|déclaration|déclarati)'
  notes: "Cross-lingual (FR question, EN-only CRR). Trap: models know the CRR2 NSFR >= 100 %; this corpus version has no binding NSFR minimum (recitals 111-112 say it is pending). drafted by Claude (5.5-B) - HIGH-RISK re-checked by Claude against SOURCE (2026-10-18); not human-verified"

- hid: H11
  type: multi_hop
  question_language: en
  question: "What do the EBA loan origination guidelines expect from banks that use automated or innovative models to decide on credit?"
  expected_behavior: answer
  expected: [{"work_id": "eba_gl_2020_06", "sections": ["4. Internal governance for credit granting and monitoring > 4.3 Credit risk policies and procedures > 4.3.3 Technology-enabled innovation for credit granting"]}, {"work_id": "eba_gl_2020_06", "sections": ["4. Internal governance for credit granting and monitoring > 4.3 Credit risk policies and procedures > 4.3.4 Models for creditworthiness assessment and credit decision-making"]}]
  source_chunk_ids: [eba_gl_loan_origination_en::structure::0037, eba_gl_loan_origination_en::structure::0038]
  ground_truth: |-
    When using technology-enabled innovation for credit granting, institutions should
    capture its risks in their risk management and control frameworks, ensure the management
    body understands it, understand the models (capabilities, assumptions, limitations,
    traceability, auditability, robustness), ensure models are fit for purpose (considering
    an interpretable model when explanations are needed), detect and prevent bias, and
    continuously monitor model performance (paragraph 53). When using automated models for
    creditworthiness assessment and credit decisions, they should understand the models and
    have policies to detect and prevent bias and ensure input data quality, measures for
    traceability, auditability, robustness and resilience, regular assessment of output
    quality including backtesting, and control mechanisms, model overrides and escalation
    procedures, together with adequate model documentation (paragraphs 54-55).
  key_facts:
    - fact: "detect and prevent bias"
      pattern: '(bias|biais)'
    - fact: "backtesting"
      pattern: '(backtest)'
    - fact: "traceability and auditability"
      pattern: '(traceability|auditability|traçabilité|auditabilité)'
  notes: "drafted by Claude (5.5-B) - not human-verified"

- hid: H12
  type: multi_hop
  question_language: fr
  question: "D'après les orientations de l'ABE sur la gouvernance interne et sur l'externalisation, qui reste responsable des activités externalisées, et que doit prévoir la politique d'externalisation ?"
  expected_behavior: answer
  expected: [{"work_id": "eba_gl_2021_05", "sections": ["4. Guidelines > 8 Outsourcing policy32"]}, {"work_id": "eba_gl_2019_02", "sections": ["4. Guidelines on outsourcing > Title III – Governance framework > 6 Sound governance arrangements and outsourcing"]}]
  source_chunk_ids: [eba_gl_internal_governance_en::structure::0063, eba_gl_outsourcing_en::structure::0038]
  ground_truth: |-
    The outsourcing of functions cannot result in the delegation of the management body's
    responsibilities: institutions remain fully responsible and accountable for complying
    with all their regulatory obligations, and the outsourcing policy must make clear that
    outsourcing does not relieve the institution of its regulatory obligations and its
    responsibilities to its customers. The outsourcing policy, approved and regularly
    reviewed by the management body, should consider the impact and risks of outsourcing
    (operational, including legal and IT, reputational and concentration risks) and include
    reporting and monitoring arrangements from inception to the end of an arrangement,
    including the business case, contract, implementation, contingency plans and exit
    strategies; it should also cover intragroup outsourcing and not hinder effective
    supervision.
  key_facts:
    - fact: "remains fully responsible"
      pattern: '(fully\s+responsible|pleinement\s+responsable|entièrement\s+responsable)'
    - fact: "exit strategies"
      pattern: '(exit\s+strateg|stratégies?\s+de\s+sortie)'
    - fact: "cannot delegate the management body's responsibilities"
      pattern: '(delegation\s+of\s+the\s+management\s+body|délégation)'
  notes: "Cross-work EBA GL 2021/05 + 2019/02; cross-lingual (FR question, EN sources). drafted by Claude (5.5-B) - not human-verified"

- hid: H13
  type: article_lookup
  question_language: fr
  question: "Que dit l'article 14 de l'AI Act ?"
  expected_behavior: answer
  expected: [{"work_id": "ai_act", "articles": ["14"]}]
  source_chunk_ids: [ai_act_fr::structure::0258, ai_act_fr::structure::0259]
  ground_truth: |-
    L'article 14 (contrôle humain) exige que les systèmes d'IA à haut risque soient conçus
    et développés de manière à pouvoir être effectivement contrôlés par des personnes
    physiques pendant leur utilisation, afin de prévenir ou de réduire au minimum les
    risques pour la santé, la sécurité ou les droits fondamentaux. Les mesures de contrôle
    sont proportionnées aux risques, au niveau d'autonomie et au contexte d'utilisation,
    intégrées par le fournisseur ou mises en œuvre par le déployeur. Les personnes chargées
    du contrôle doivent notamment pouvoir comprendre les capacités et limites du système,
    rester conscientes du biais d'automatisation, interpréter correctement les sorties,
    décider de ne pas utiliser le système ou d'ignorer, remplacer ou inverser sa sortie, et
    interrompre son fonctionnement.
  key_facts:
    - fact: "contrôle humain"
      pattern: '(contrôle\s+humain|human\s+oversight)'
    - fact: "biais d'automatisation"
      pattern: '(biais\s+d.automatisation|automation\s+bias)'
    - fact: "interrompre / arrêter le système"
      pattern: '(interrompre|arrêt|stop|interrupt)'
  notes: "drafted by Claude (5.5-B) - not human-verified"

- hid: H14
  type: article_lookup
  question_language: fr
  question: "Que prévoit l'article 501 du CRR ?"
  expected_behavior: answer
  expected: [{"work_id": "crr", "articles": ["501"]}]
  source_chunk_ids: [crr_en::structure::0913]
  ground_truth: |-
    Article 501 provides that capital requirements for credit risk on exposures to SMEs are
    multiplied by the factor 0,7619 (the SME supporting factor). The exposure must be in the
    retail, corporate or secured-by-immovable-property classes (defaulted exposures
    excluded), the SME is defined by Commission Recommendation 2003/361/EC using only annual
    turnover, and the total amount owed by the client or group of connected clients
    (excluding claims secured on residential property) must not exceed EUR 1,5 million.
    Institutions report SME exposures to competent authorities every three months.
  key_facts:
    - fact: "factor 0,7619"
      pattern: '0[.,]7619'
    - fact: "EUR 1,5 million"
      pattern: '1[.,]5\s+mill'
    - fact: "SMEs / PME"
      pattern: '(SME|PME)'
  notes: "Cross-lingual (FR question, EN-only CRR). drafted by Claude (5.5-B) - not human-verified"

- hid: H15
  type: article_lookup
  question_language: en
  question: "What does Article 30 of DORA require?"
  expected_behavior: answer
  expected: [{"work_id": "dora", "articles": ["30"]}]
  source_chunk_ids: [dora_fr::structure::0185, dora_fr::structure::0186]
  ground_truth: |-
    L'article 30 (principales dispositions contractuelles) exige que les droits et
    obligations de l'entité financière et du prestataire tiers de services TIC soient
    définis clairement et consignés dans un document écrit unique incluant les accords de
    niveau de service. Les contrats comportent au moins une description des services et des
    conditions de sous-traitance, les lieux de fourniture des services et de traitement des
    données, des dispositions sur la protection des données et sur l'accès, la récupération
    et la restitution des données, les niveaux de service, l'assistance en cas d'incident
    TIC, la coopération avec les autorités, les droits de résiliation et les préavis. Pour
    les services soutenant des fonctions critiques ou importantes, des éléments
    supplémentaires sont exigés, notamment des niveaux de service détaillés avec objectifs
    de performance, des obligations de notification, des plans d'urgence testés et des
    mesures de sécurité des TIC.
  key_facts:
    - fact: "written contract"
      pattern: '(par\s+écrit|written|document\s+écrit)'
    - fact: "locations of services and data"
      pattern: '(lieux|locations?)'
    - fact: "termination rights"
      pattern: '(résiliation|terminat)'
  notes: "Cross-lingual (EN question, FR-only DORA). drafted by Claude (5.5-B) - not human-verified"

