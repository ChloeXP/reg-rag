# golden-v2 (step 6.9): scoring-only corrections on top of the v1 sources.
# The v1 sources (smoke_golden.yaml, review/factual_accepted.jsonl, handwritten.yaml) are NOT
# edited: rag.build_golden applies these patches after loading them. Each patch states the old
# value (must match exactly, so a patch can never silently apply to something else), the new
# value, the journal entry it fixes and the evidence. Corpus changes (P56) are out of scope.
# Audit method: ALL non-refused answers of 5 e2e runs (3b dense/rerank5/rerank3, 7b rerank/
# dense = 155 answers) were checked both ways: missed facts written differently (false
# negatives) AND generic patterns matching the wrong thing (false positives, P64).
