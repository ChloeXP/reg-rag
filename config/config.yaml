# Single source of truth for all parameters.
# Experiments change THIS file, never the code. MLflow logs it as params.

project:
  name: reg-rag
  seed: 42

paths:
  sources: data/sources.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  embeddings_dir: data/processed/embeddings   # vector cache, one parquet per model (step 3.2)
  manifest: data/manifest.csv
  prompts_dir: prompts
  runs_dir: runs                              # rag.ask appends runs/ask_log.jsonl (gitignored)

llm:
  base_url: http://localhost:11434   # Ollama runs natively on macOS (Metal GPU)
  model: qwen2.5:3b                  # dev model; qwen2.5:7b for final evaluation
  temperature: 0.0                   # deterministic answers -> reproducible eval
  num_ctx: 8192                      # Ollama default 4096 silently truncates long RAG prompts
  timeout_s: 180
  prompt_version: v1                 # prompts/<version>.yaml (step 4.2); logged with every answer

generation:            # step 4
  default_language: en # used when the question has no FR/EN signal (e.g. "CRR Article 395")

# Filled in later steps:
chunking:              # how chunks.parquet is BUILT (rag.ingest makes both strategies)
  tokenizer: BAAI/bge-m3   # count tokens with the embedding model's own tokenizer
  chunk_size: 512      # tokens
  chunk_overlap: 64    # tokens shared by two consecutive fixed chunks
  include_footnotes: false  # decision 2.2b-C: footnotes kept as blocks, off by default

embedding:
  model: BAAI/bge-m3   # multilingual FR/EN, 1024-d dense; same model as chunking.tokenizer
  device: mps          # step 3.1 bench: mps 4.1 chunks/s vs cpu 2.5 (scripts/bench_embed.py)
  batch_size: 16       # 8/16/32 within noise (4.1/4.0/3.8 chunks/s) -> middle value
  normalize: true      # unit vectors: cosine == dot product

retrieval:
  strategy: structure  # fixed | structure: which chunk collection search() queries.
                       # Baseline (step 4): structure, chosen on 5 smoke queries only;
                       # fixed vs structure is re-tested on the golden set (step 6).
                       # Moved here from chunking.strategy in 6.0 (decision 4.1-C).
  top_k: 5             # baseline: 5 x ~310 tokens (structure) ~ 1.6k ctx tokens << num_ctx 8192
  mode: dense          # dense | bm25 | hybrid
  bm25:                # Okapi BM25, classic defaults (Robertson); tuned later on the golden set
    k1: 1.2            # term-frequency saturation: the 3rd occurrence adds little
    b: 0.75            # length normalisation: long chunks are not favoured just for being long
  hybrid:              # Reciprocal Rank Fusion of dense + bm25 (step 3.6)
    candidates: 20     # hits fetched from EACH retriever before fusing
    rrf_k: 60          # RRF constant from Cormack et al. 2009; larger = flatter rank weights
  rerank:              # step 6.4: cross-encoder re-scores the first-stage candidates
    enabled: true      # baseline-v2 (decision 6.6d-B). baseline-v1 = false. Evidence, 3b, dev 40:
                       # key-fact recall 0.51 -> 0.70 (13 better / 4 worse, p = 0.049),
                       # all facts 0.29 -> 0.52; retrieval hit@5 unchanged (0.79); +7.6 s/question
    model: BAAI/bge-reranker-v2-m3   # multilingual (same XLM-R family as bge-m3), FR/EN pairs
    candidates: 20     # first-stage hits re-scored; = eval.retrieval_depth, so hit@20 cannot change
    batch_size: 8
    max_length: 1024   # >= question + a 512-token chunk: nothing is truncated

vector_store:
  url: http://localhost:6333
  distance: cosine     # vectors are unit-length -> same ranking as dot; robust if normalize=false
  upsert_batch: 256    # points per upsert request

eval:                  # step 5
  golden_spec: eval/golden_spec.yaml   # blueprint: quotas per type / split / language / work
  handwritten: eval/handwritten.yaml   # 5.5: multi_hop / article_lookup / no_answer / adversarial
  smoke_golden: eval/smoke_golden.yaml # 5.6: ground truths + key facts for the 5 smoke queries
  golden_set: eval/golden_set.jsonl    # the questions themselves (5.4-5.5)
  golden_patches: eval/golden_patches.yaml  # 6.9 golden-v2: scoring-only patches over the v1 sources
  # step 6.1 - retrieval layer (decision 6.0-B: no LLM, deterministic location metrics)
  retrieval_depth: 20  # ONE ranking per question; every @k is read from its prefix.
                       # Must be <= retrieval.hybrid.candidates, else hybrid top-k changes.
  ks: [1, 3, 5, 10, 20]
  runs_subdir: eval    # runs/<runs_subdir>/<timestamp>__<tag>/ (gitignored, like runs/)
  # 6.5 (P55): which rule decides that a retrieved card "found" an expected location
  hit_rule: span       # span = text overlap with the location's text (works for ANY chunking);
                       # location = golden.is_hit on card metadata (structure cards only)
  span:
    shingle_words: 8   # 8-word sequences: 5 matched repeated legal boilerplate across articles
    min_share_of_hit: 0.5       # >= half of the card's text comes from the location, OR
    min_share_of_location: 0.5  # the card holds >= half of the location (short recitals)
  ragas:               # step 6.7 (decision 6.7-A: ragas only in the `eval` dependency group)
    judge_model: reg-rag-judge:qwen2.5-7b      # built from judge_modelfile (num_ctx, temp 0)
    judge_modelfile: eval/judge/qwen2.5-7b.Modelfile
    base_url: http://localhost:11434/v1        # Ollama's OpenAI-compatible endpoint
    max_tokens: 2048   # judge output (statement lists, verdicts)
    timeout_s: 600
    metrics: [faithfulness, answer_relevancy, context_precision, context_recall]
    subset:            # decision 6.7-C: ~2.8 min/item with a 7b judge -> 12 of the 31 answerable
      quotas: {factual: 7, multi_hop: 3, article_lookup: 2}
      anchors: [G001, G003, G004, G012, G021]   # already judged in the 6.7b trial (kept, not redone)
      seed: 42         # tie-break only; priority: human line-by-line > cross-lingual > new work

mlflow:
  tracking_uri: http://localhost:5001
  experiment: reg-rag

parsing:
  edge_band_pt: 72            # header/footer zone = 72 pt (1 inch) from top/bottom edge, any orientation
  boilerplate_min_ratio: 0.3  # a line repeated in that zone on >= 30% of pages is boilerplate
  footnote_size_gap: 0.5      # footnote line = font at least 0.5 pt smaller than the page's body font
  paragraph_gap_ratio: 0.6    # new paragraph if vertical gap > 0.6 x previous line height
  heading_size_gap: 1.5       # heading if font >= body font + 1.5 pt (EBA headings: 16-26 pt vs 11)
