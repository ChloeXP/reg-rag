# Single source of truth for all parameters.
# Experiments change THIS file, never the code. MLflow logs it as params.

project:
  name: reg-rag
  seed: 42

paths:
  sources: data/sources.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/manifest.csv
  prompts_dir: prompts

llm:
  base_url: http://localhost:11434   # Ollama runs natively on macOS (Metal GPU)
  model: qwen2.5:3b                  # dev model; qwen2.5:7b for final evaluation
  temperature: 0.0                   # deterministic answers -> reproducible eval
  num_ctx: 8192                      # Ollama default 4096 silently truncates long RAG prompts
  timeout_s: 180

# Filled in later steps:
chunking:
  strategy: fixed      # fixed | structure   (step 2)
  tokenizer: BAAI/bge-m3   # count tokens with the embedding model's own tokenizer
  chunk_size: 512      # tokens
  chunk_overlap: 64    # tokens shared by two consecutive fixed chunks
  include_footnotes: false  # decision 2.2b-C: footnotes kept as blocks, off by default

embedding:
  model: BAAI/bge-m3   # multilingual FR/EN, 1024-d dense; same model as chunking.tokenizer
  device: mps          # step 3.1 bench: mps 4.1 chunks/s vs cpu 2.5 (scripts/bench_embed.py)
  batch_size: 16       # 8/16/32 within noise (4.1/4.0/3.8 chunks/s) -> middle value
  normalize: true      # unit vectors: cosine == dot product

retrieval:
  top_k: 5             # (step 3-4)

vector_store:
  url: http://localhost:6333

mlflow:
  tracking_uri: http://localhost:5001
  experiment: reg-rag

parsing:
  edge_band_pt: 72            # header/footer zone = 72 pt (1 inch) from top/bottom edge, any orientation
  boilerplate_min_ratio: 0.3  # a line repeated in that zone on >= 30% of pages is boilerplate
  footnote_size_gap: 0.5      # footnote line = font at least 0.5 pt smaller than the page's body font
  paragraph_gap_ratio: 0.6    # new paragraph if vertical gap > 0.6 x previous line height
  heading_size_gap: 1.5       # heading if font >= body font + 1.5 pt (EBA headings: 16-26 pt vs 11)
